name: Semgrep
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7 5 * * 2'
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep (pinned)
        run: python3 -m pip install --user 'semgrep==1.179.0'
      - name: Scan
        run: |
          ~/.local/bin/semgrep scan --config p/security-audit --config p/secrets --config p/default \
            --exclude build/live_workspace --exclude '**/vendor/**' --exclude '*.min.js' --max-target-bytes 1000000 \
            --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
